name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  PLUGIN_ID: vocat-sip
  GO_VERSION: '1.23'
  NODE_VERSION: '24'

jobs:
  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            goarch: amd64
            artifact: vocat-sip-backend-linux-amd64
          - os: ubuntu-latest
            arch: arm64
            goarch: arm64
            artifact: vocat-sip-backend-linux-arm64
          - os: ubuntu-latest
            arch: '386'
            goarch: '386'
            artifact: vocat-sip-backend-linux-386
          - os: ubuntu-latest
            arch: armv7
            goarch: arm
            goarm: 7
            artifact: vocat-sip-backend-linux-armv7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          always-auth: false

      - name: Build frontend (amd64 only)
        if: matrix.arch == 'amd64'
        working-directory: frontend
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only
          fi
          npm ci
          npm run build

      - name: Upload frontend assets
        if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-assets
          path: assets/
          retention-days: 30

      - name: Download frontend assets
        if: matrix.arch != 'amd64'
        uses: actions/download-artifact@v4
        with:
          name: frontend-assets
          path: assets/

      - name: Build backend
        working-directory: backend
        env:
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          go mod tidy
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ${{ matrix.artifact }} .

      - name: Package plugin
        run: |
          mkdir -p dist/${{ env.PLUGIN_ID }}
          cp vocat-plugin.json dist/${{ env.PLUGIN_ID }}/
          
          # Copy backend binary
          mkdir -p dist/${{ env.PLUGIN_ID }}/backend
          cp backend/${{ matrix.artifact }} dist/${{ env.PLUGIN_ID }}/backend/vocat-sip-backend
          
          # Copy frontend assets
          cp -r assets/* dist/${{ env.PLUGIN_ID }}/
          
          # Create zip
          cd dist
          zip -r ${{ env.PLUGIN_ID }}-${{ matrix.arch }}.zip ${{ env.PLUGIN_ID }}/
          
          # Also copy binary for direct download
          cp ${{ env.PLUGIN_ID }}/backend/vocat-sip-backend ${{ env.PLUGIN_ID }}-backend-${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_ID }}-${{ matrix.arch }}
          path: |
            dist/${{ env.PLUGIN_ID }}-${{ matrix.arch }}.zip
            dist/${{ env.PLUGIN_ID }}-backend-${{ matrix.arch }}
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: |
          find artifacts -type f | sort

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.zip > SHA256SUMS.txt
          sha256sum *-backend-* >> SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/*-backend-*
            artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker Multi-arch
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-assets
          path: assets/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/386,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify:
    name: Notify
    needs: [release, docker]
    runs-on: ubuntu-latest
    if: always() && (needs.release.result == 'success' || needs.docker.result == 'success')
    steps:
      - name: Summary
        run: |
          echo "## Release Published"
          echo ""
          echo "**Tag**: ${{ github.ref_name }}"
          echo "**Repository**: ${{ github.repository }}"
          echo ""
          echo "### Assets"
          echo "- Plugin packages (per architecture)"
          echo "- Backend binaries (per architecture)"
          echo "- SHA256SUMS.txt"
          echo ""
          echo "### Docker"
          echo "\`\`\`bash"
          echo "docker pull ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.ref_name }}"
          echo "\`\`\`"
          echo ""
          echo "### Installation"
          echo "1. Download \`vocat-sip-plugin-<arch>.zip\` for your architecture"
          echo "2. In VoCat Web UI: Extensions → Upload Plugin"
          echo "3. Enable the plugin and configure SIP accounts"